<svg width="320" height="360" viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Trenkit Apps and Games</title>
  <desc id="logoDesc">Stylized smartphone with rocket launching and Trenkit wordmark</desc>
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEE9" />
      <stop offset="50%" stop-color="#3E4BE8" />
      <stop offset="100%" stop-color="#A044FF" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A3C" />
      <stop offset="100%" stop-color="#FF3C83" />
    </linearGradient>
    <linearGradient id="grad-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04B9FF" />
      <stop offset="100%" stop-color="#9B4BFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="60" y="20" width="200" height="320" rx="36" stroke="url(#grad-primary)" stroke-width="10" fill="none" />
    <rect x="98" y="60" width="124" height="240" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  </g>

  <g transform="translate(0,25)">
    <path d="M175 220c10-42 8-73-6-110l-6-16c-2-6-3-9-3-13 0-16 13-29 29-29 13 0 23 8 27 19l4 11c15 44 17 82 5 129l-50 9z" fill="url(#grad-primary)" />
    <path d="M193 112c17 40 20 75 8 118l-32 6c9-40 7-69-7-106l31-18z" fill="url(#grad-accent)" />
    <circle cx="204" cy="117" r="12" fill="#fff" opacity="0.85" />
    <path d="M174 224c-10 22-30 37-52 41 14-17 17-38 10-53l42 12z" fill="#FDE047" opacity="0.9" />
  </g>

  <path d="M74 210c71 40 170 52 220-6" fill="none" stroke="url(#grad-orbit)" stroke-width="18" stroke-linecap="round" />
  <path d="M242 140l26-14-8 28" fill="#FF9A3C" opacity="0.9" />

  <g fill="#65D1FF" opacity="0.9">
    <rect x="70" y="60" width="14" height="14" rx="4" />
    <rect x="90" y="45" width="12" height="12" rx="4" />
    <rect x="110" y="30" width="10" height="10" rx="3" />
    <rect x="260" y="80" width="12" height="12" rx="3" opacity="0.6" />
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="160" y="320" font-size="56" font-weight="700" fill="url(#grad-primary)">Trenkit</text>
    <text x="160" y="350" font-size="20" letter-spacing="4" fill="#A3B8FF">APPS &amp; GAMES</text>
  </g>
</svg>
